pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases'
        }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.6.2'
}

rootProject.name = 'VI-EN-Vietnamese-Telex'

include 'common'

stonecutter {
    create(rootProject) {
        def match = { String projectVer, String... loaders ->
            loaders.each { loader ->
                vers("$projectVer-$loader", projectVer).buildscript = "build." + loader + ".gradle"
            }
        }

        match("1.20.1", "fabric", "forge")
        match("1.21.1", "fabric", "neoforge")
        // match("26.3", "fabric", "neoforge") // Yeu cau Gradle 9 + Java 25 de decompile MC 26.x

        vcsVersion = "1.20.1-forge"
    }
}
