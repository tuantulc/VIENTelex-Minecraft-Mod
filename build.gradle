subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group_id

    repositories {
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
}
