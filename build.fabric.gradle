plugins {
    id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.31'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${output_version_name}"
}

repositories {
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation fileTree(dir: 'fabric-api-jars', include: ['*.jar'])
    compileOnly "com.terraformersmc:modmenu:21.0.0"
}

sourceSets.main.java.srcDirs = [
    rootProject.file('common/src/main/java'),
    rootProject.file('fabric/src/main/java')
]
sourceSets.main.resources.srcDirs = [
    rootProject.file('common/src/main/resources'),
    rootProject.file('fabric/src/main/resources')
]

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency_range', minecraft_dependency_range
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_description', mod_description
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_license', mod_license

    filesMatching('fabric.mod.json') {
        expand([
                'version': project.version,
                'minecraft_dependency_range': minecraft_dependency_range,
                'mod_name': mod_name,
                'mod_description': mod_description,
                'mod_authors': mod_authors,
                'mod_license': mod_license
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}
